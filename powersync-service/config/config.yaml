replication:
  connections:
    - type: postgresql
      uri: postgresql://powersync_role:myhighlyrandompassword@postgres:5432/postgres
      sslmode: disable

storage:
  type: postgresql
  uri: postgresql://postgres:postgres@postgres:5432/powersync_storage
  sslmode: disable

port: 8080

sync_rules:
  content: |
    bucket_definitions:
      # Account-level data — one bucket per user. Device list and user-scoped
      # settings.
      user_account:
        priority: 1
        parameters: SELECT request.user_id() as user_id
        data:
          - SELECT * FROM powersync.settings WHERE user_id = bucket.user_id
          - SELECT * FROM powersync.devices WHERE user_id = bucket.user_id

      # User-private data — parameterized by user_id so we can filter without
      # referencing request.user_id() inside the data query (which PowerSync
      # rejects). Every row is owned by exactly one user.
      user_private:
        priority: 1
        parameters: SELECT request.user_id() as user_id
        data:
          - SELECT * FROM powersync.chat_threads WHERE user_id = bucket.user_id
          - SELECT * FROM powersync.chat_messages WHERE user_id = bucket.user_id
          - SELECT * FROM powersync.tasks WHERE user_id = bucket.user_id

      # User-scoped resource config — same ownership model as user_private,
      # lower priority so chat data lands first on initial sync.
      user_resources:
        priority: 2
        parameters: SELECT request.user_id() as user_id
        data:
          - SELECT * FROM powersync.models WHERE user_id = bucket.user_id
          - SELECT * FROM powersync.prompts WHERE user_id = bucket.user_id
          - SELECT * FROM powersync.skills WHERE user_id = bucket.user_id
          - SELECT * FROM powersync.triggers WHERE user_id = bucket.user_id
          - SELECT * FROM powersync.modes WHERE user_id = bucket.user_id
          - SELECT * FROM powersync.model_profiles WHERE user_id = bucket.user_id
          - SELECT * FROM powersync.agents WHERE user_id = bucket.user_id

client_auth:
  supabase: false
  audience: ['powersync-dev', 'powersync']
  jwks:
    keys:
      # HS256 key for local dev - must match backend POWERSYNC_JWT_SECRET (raw) and POWERSYNC_JWT_KID
      # k is base64 of the shared secret
      - kty: oct
        k: cG93ZXJzeW5jLWRldi1zZWNyZXQtY2hhbmdlLWluLXByb2R1Y3Rpb24=
        alg: HS256
        kid: powersync-dev
  telemetry:
    disable_telemetry_sharing: false
